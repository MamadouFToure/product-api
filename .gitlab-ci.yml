stages:
  - test
  - build
  - docker

# Cache pour Maven pour accélérer les builds
cache:
  paths:
    - .m2/repository

# Job de tests unitaires
test:
  stage: test
  image: maven:3.9.6-eclipse-temurin-17
  script:
    # Installer le JAR local si besoin
    - mvn install:install-file -Dfile=libs/product-core-0.3.0.jar -DgroupId=sn.isi.l3gl.core -DartifactId=product-core -Dversion=0.3.0 -Dpackaging=jar
    - mvn test

# Job de build
build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-17
  script:
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - target/*.jar

# Job Docker
docker:
  stage: docker
  image: docker:20.10.16
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375/
    DOCKER_TLS_CERTDIR: ""
  dependencies:
    - build
  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - docker build -t $DOCKER_IMAGE .
    - docker push $DOCKER_IMAGE
  only:
    - develop